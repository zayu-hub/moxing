<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>模玩寄售查询</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:#e8ecf4;
  color:#0d1b3e;
  min-height:100vh;
}

/* ── 背景网格纹理 ── */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(30,80,200,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(30,80,200,.06) 1px, transparent 1px);
  background-size:32px 32px;
  pointer-events:none;z-index:0;
}

/* ── 顶部 Header ── */
.header{
  background:linear-gradient(135deg,#0a1f6e 0%,#1a3fbf 60%,#2255cc 100%);
  padding:16px 18px 14px;
  position:sticky;top:0;z-index:100;
  border-bottom:2px solid #3a6fef;
  box-shadow:0 4px 20px rgba(10,31,110,.4);
}
.header-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.header-label{
  font-size:10px;color:rgba(255,255,255,.5);letter-spacing:2px;
  font-weight:500;
}
.header-label::before{content:'/// '}
.header-title{
  font-size:20px;font-weight:800;color:#fff;letter-spacing:1px;
  text-shadow:0 0 20px rgba(100,160,255,.6);
}
.header-title span{color:#60aaff}

/* ── 搜索框 ── */
.search-wrap{
  position:relative;
  margin-bottom:10px;
}
.search-wrap::before{
  content:'';
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:70%;
  background:linear-gradient(#60aaff,#2255cc);
  border-radius:2px;
}
.search-wrap input{
  width:100%;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(100,160,255,.4);
  border-radius:6px;
  padding:9px 14px 9px 20px;
  font-size:14px;color:#fff;
  outline:none;
  backdrop-filter:blur(4px);
  transition:border-color .2s,background .2s;
}
.search-wrap input::placeholder{color:rgba(255,255,255,.45)}
.search-wrap input:focus{
  border-color:#60aaff;
  background:rgba(255,255,255,.18);
}

/* ── 筛选按钮 ── */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{
  border:1px solid rgba(100,160,255,.35);
  background:rgba(255,255,255,.1);
  color:rgba(255,255,255,.75);
  border-radius:4px;
  padding:4px 11px;font-size:12px;
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
  letter-spacing:.5px;
}
.filter-btn::before{content:'# ';opacity:.5;font-size:10px}
.filter-btn.active{
  background:linear-gradient(90deg,#2d6ae0,#1a3fbf);
  border-color:#60aaff;
  color:#fff;
  box-shadow:0 0 12px rgba(45,106,224,.5);
}
.filter-btn.active::before{opacity:.8}
.filter-divider{
  width:1px;background:rgba(255,255,255,.2);
  margin:0 2px;align-self:stretch;
}

/* ── 统计栏 ── */
.stats{
  font-size:11px;color:rgba(30,60,150,.7);
  padding:8px 18px;
  display:flex;align-items:center;gap:6px;
  position:relative;z-index:1;
}
.stats::before{
  content:'///';font-size:10px;
  color:rgba(30,80,200,.4);letter-spacing:1px;
}

/* ── 列表 ── */
.list{padding:4px 12px 60px;position:relative;z-index:1}

/* ── 商品卡片 ── */
.item{
  display:flex;align-items:center;gap:10px;
  background:#fff;
  border:1px solid #d4ddf5;
  border-left:3px solid #2d6ae0;
  border-radius:8px;
  margin-bottom:7px;
  padding:11px 13px;
  text-decoration:none;color:inherit;
  transition:all .15s;
  position:relative;overflow:hidden;
}
.item::before{
  content:'';
  position:absolute;top:0;right:0;
  width:40px;height:40px;
  background:linear-gradient(225deg,rgba(45,106,224,.06) 0%,transparent 60%);
}
.item:hover{
  border-color:#2d6ae0;
  border-left-color:#60aaff;
  box-shadow:0 2px 16px rgba(45,106,224,.15);
  transform:translateX(2px);
}
.item-index{
  font-size:11px;color:#b0bcd8;
  min-width:22px;text-align:center;
  font-variant-numeric:tabular-nums;
}
.item-info{flex:1;min-width:0}
.item-name{
  font-size:14px;font-weight:600;
  color:#0d1b3e;
  line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.item-meta{display:flex;gap:5px;margin-top:5px;align-items:center}

/* ── 六边形徽标 ── */
.badge{
  font-size:10px;font-weight:600;
  padding:2px 8px;
  border-radius:3px;
  letter-spacing:.5px;
  white-space:nowrap;
}
.badge-cat{
  background:#0d1b3e;color:#60aaff;
  border:1px solid rgba(96,170,255,.3);
}
.badge-series{
  background:rgba(45,106,224,.1);
  color:#1a3fbf;
  border:1px solid rgba(45,106,224,.25);
}
.badge-series.mg{background:rgba(200,30,30,.08);color:#c01a1a;border-color:rgba(200,30,30,.2)}
.badge-series.rg{background:rgba(200,100,0,.08);color:#b85c00;border-color:rgba(200,100,0,.2)}
.badge-series.pg{background:rgba(30,150,30,.08);color:#187018;border-color:rgba(30,150,30,.2)}
.badge-series.mb{background:rgba(45,106,224,.1);color:#1a3fbf;border-color:rgba(45,106,224,.25)}
.badge-series.mr{background:rgba(100,20,180,.08);color:#6614b4;border-color:rgba(100,20,180,.2)}
.badge-series.hg{background:rgba(0,140,150,.08);color:#007a80;border-color:rgba(0,140,150,.2)}
.badge-series.gm{background:#f5f5f5;color:#555;border-color:#ddd}

.item-arrow{
  color:#b0bcd8;font-size:18px;flex-shrink:0;
  font-weight:300;
}

/* ── 空状态 ── */
.empty{
  text-align:center;padding:80px 20px;
  color:#8a9abf;font-size:14px;
}
.empty::before{content:'/// ';color:#c0ccdf;font-size:12px}

/* ── 顶角装饰 ── */
.corner{
  position:absolute;
  width:12px;height:12px;
  border-color:#60aaff;
  border-style:solid;
  opacity:.6;
}
.corner-tr{top:8px;right:8px;border-width:2px 2px 0 0;border-radius:0 3px 0 0}
.corner-bl{bottom:8px;left:8px;border-width:0 0 2px 2px;border-radius:0 0 0 3px}
</style>
</head>

<div class="header">

  <div class="header-top">

  <div class="filters" id="filters"></div>
</div>

<div class="stats" id="stats"></div>
<div class="list" id="list"></div>

  if (activeCat!=='all')    data = data.filter(d=>d.cat===activeCat);
  if (activeSeries!=='all') data = data.filter(d=>d.series===activeSeries);
  if (q) data = data.filter(d=>d.name.toLowerCase().includes(q));

  document.getElementById('stats').textContent = `共 ${data.length} 件商品`;

  if (!data.length) {
    document.getElementById('list').innerHTML = '<div class="empty">未找到相关商品</div>';
    return;
  }

  document.getElementById('list').innerHTML = data.map((d,i) => {
    const sc = SERIES_CLS[d.series]||'';
    return `<a class="item" href="qiandao://product?spuId=${d.id}">
      <span class="item-index">${i+1}</span>
      <div class="item-info">
        <div class="item-name">${esc(d.name)}</div>
        <div class="item-meta">
          <span class="badge badge-cat">${d.cat}</span>
          ${d.series!=='国产模型'?`<span class="badge badge-series ${sc}">${d.series}</span>`:''}
        </div>
      </div>
      <span class="item-arrow">›</span>
    </a>`;
  }).join('');
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

buildFilters();
render();
</script>
</body>
</html>
